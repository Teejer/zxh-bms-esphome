# Five LiFePO4 packs on ONE ESP32, read one at a time (sequential mode).
#
# Only one BLE link is ever open: when a pack's update_interval elapses the
# scheduler connects to it, runs the read, disconnects, and hands the radio
# to the next pack that is waiting. A pack that is off/unreachable is
# abandoned after cycle_timeout so it never blocks the others.
#
# WiFi + battery MACs live in secrets.yaml (gitignored).
# Find/verify MACs with:  bms-cli scan

esphome:
  name: zxh-bms-mux
  friendly_name: ZXH BMS Multi-Pack Gateway

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  - platform: esphome

logger:
  level: DEBUG
  logs:
    api: INFO
    esp32_ble: INFO
    wifi: INFO
    component: INFO
    sensor: INFO
    text_sensor: INFO
    binary_sensor: INFO

esp32_ble:
  max_connections: 5

esp32_ble_tracker:

# ---------------------------------------------------------------------------
# BLE links (one per pack; MAC address of the battery)
# ---------------------------------------------------------------------------
ble_client:
  - mac_address: !secret bms_mac_1
    id: ble_pack_1
  - mac_address: !secret bms_mac_2
    id: ble_pack_2
  - mac_address: !secret bms_mac_3
    id: ble_pack_3
  - mac_address: !secret bms_mac_4
    id: ble_pack_4
  - mac_address: !secret bms_mac_5
    id: ble_pack_5

# ---------------------------------------------------------------------------
# Protocol hubs: one per pack, sharing the radio one connection at a time.
# Each pack can have its own polling frequency via update_interval.
# ---------------------------------------------------------------------------
zxh_bms:
  - id: pack_1
    ble_client_id: ble_pack_1
    mode: sequential
    update_interval: 2min
    cycle_timeout: 90s

  - id: pack_2
    ble_client_id: ble_pack_2
    mode: sequential
    update_interval: 2min

  - id: pack_3
    ble_client_id: ble_pack_3
    mode: sequential
    update_interval: 2min

  - id: pack_4
    ble_client_id: ble_pack_4
    mode: sequential
    update_interval: 2min

  - id: pack_5
    ble_client_id: ble_pack_5
    mode: sequential
    update_interval: 2min

# ---------------------------------------------------------------------------
# Entities. Every block names its pack with zxh_bms_id; the name: values are
# what show up in Home Assistant. Drop any entity you don't want.
# ---------------------------------------------------------------------------
